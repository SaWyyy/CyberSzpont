apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secuscan-ingress
  namespace: secuscan-ns
spec:
  ingressClassName: nginx
  rules:
    - host: secuscan.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: upload-service-svc
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80