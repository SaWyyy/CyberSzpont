name: CI Upload Service

on:
  push:
    paths:
      - 'upload-service/**'
      - '.github/workflows/ci-upload-service.yml'
  workflow_dispatch: 

jobs:
  measure_python_pipeline:
    name: Build & Scan Backend
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./upload-service

    steps:
      - name: 1. Pobranie kodu
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zależności
        run: pip install -r requirements.txt
        
      # - name: SAST Scan (Semgrep)
      #   run: |
      #     pip install semgrep
      #     semgrep scan --config=auto
      
      - name: Budowa obrazu Docker
        run: docker build -t secuscan-api:test .

