name: CI Frontend (JavaScript/Node)

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:

jobs:
  measure_node_pipeline:
    name: Build & Scan Frontend
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 1. Pobranie kodu
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalacja zależności (npm)
        run: npm install

      # - name: SAST Scan (Semgrep)
      #   run: |
      #     pip install semgrep
      #     semgrep scan --config=auto

      - name: Budowa kodu i obrazu Docker
        run: |
          npm run build
          docker build -t secuscan-frontend:test .

      # - name: SCA Docker Scan (Trivy)
